##########################################################################################
# Delivery harness: Claude Code takes an issue labeled `prioritized` to a pull request.  #
#----------------------------------------------------------------------------------------#
# The issue's `harness:*` label is the task state. Each stage is run by one agent, with  #
# its role and tools defined in .claude/agents/<agent>.md; the workflow picks the agent, #
# hands it its context, checks its output and only then moves the label forward. Each    #
# agent signs its comments on the issue.                                                 #
#                                                                                        #
# prioritized ─► triage (PM) ─┬─(UI)─► design (Designer) ─┬─► plan (Planner)             #
#                             └───────────────────────────┘                              #
# triage / design / plan ─► awaiting-answers ──(reply)──► the stage that asked           #
# plan ─► awaiting-approval ─┬─(/revise)──► plan                                         #
#                            └─(/approve)─► implementation (Implementer)                 #
# implementation ─► testing (Tester) ─► review (Reviewer) ─► deployment (Deployer)       #
#                 ◄──(fail / changes, at most twice per run)──┘     └─► delivered (PR)   #
# implementation / deployment ─► awaiting-answers (plan didn't hold up) ─(reply)─► plan  #
#                                                                                        #
# A failed stage adds `harness:blocked`; `/resume` repeats it, restarting the build from #
# implementation, since commits only live in the run that made them.                     #
# Only the repository owner can move the state, and only their comments are              #
# given to Claude. Removing `prioritized` pauses the harness.                            #
#                                                                                        #
# Setup: create the `prioritized` label, run `/install-github-app` in Claude Code        #
# (subscription login; it stores the CLAUDE_CODE_OAUTH_TOKEN secret), and enable         #
# "Allow GitHub Actions to create and approve pull requests". PRs opened with the        #
# default token don't trigger CI; set HARNESS_GITHUB_TOKEN (contents + pull requests     #
# write) to have them run it.                                                            #
##########################################################################################

name: Harness

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  deliver:
    # Runs only for the repository owner, even on a public repo.
    if: >-
      github.actor == github.repository_owner && (
      (github.event_name == 'issues' && github.event.label.name == 'prioritized') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(join(github.event.issue.labels.*.name, ' '), 'harness:')))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # One run per issue at a time, so the state read by the router is never stale.
    concurrency:
      group: harness-issue-${{ github.event.issue.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      ACTOR: ${{ github.actor }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Keeps the token out of .git/config, where Claude could read it.
          persist-credentials: false

      - name: Route
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          source .github/harness/lib.sh
          harness_route

      - name: Install dependencies
        if: steps.route.outputs.stage == 'implementation'
        uses: ./.github/actions/yarn-install

      - name: Install Claude Code
        if: steps.route.outputs.stage != ''
        run: npm install --global @anthropic-ai/claude-code@2.1.311

      # Picks each stage's agent, hands it its context, checks its output and moves the
      # issue on, until a stage needs the owner or the PR is open.
      - name: Drive
        if: steps.route.outputs.stage != ''
        env:
          STAGE: ${{ steps.route.outputs.stage }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_TOKEN: ${{ secrets.HARNESS_GITHUB_TOKEN || github.token }}
        run: |
          source .github/harness/lib.sh
          harness_drive "$STAGE"

      - name: Block on failure
        if: failure() && steps.route.outputs.stage != ''
        run: |
          source .github/harness/lib.sh
          reason=$(cat "$RUNNER_TEMP/harness-block-reason" 2>/dev/null || echo "A stage failed; see the run logs.")
          harness_block
          harness_comment harness "Blocked" "$reason" "@$ACTOR, fix it and comment \`/resume\`."
