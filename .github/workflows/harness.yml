##########################################################################################
# Issue harness: an issue labeled `priorizado` goes through PM, Planner, Designer,       #
# Implementer, Tester, Reviewer and Deployer up to the merge (harness/workflow.py).      #
#----------------------------------------------------------------------------------------#
# Each job runs one step. The task state lives in runs/<issue>.json on the               #
# `harness-state` branch; each step checks it is in the state it expects, runs its       #
# agent, checks the result against the gates in harness/policy.py and outputs `next`,    #
# the job that runs after it. Human decisions are issue commands (harness/responses.py): #
#   /opcao N · /aprovar plano <fp> · /ajustar <texto> · /aprovar merge <sha>             #
#   /conversar (handoff to an interactive session) · /retomar                            #
#                                                                                        #
# Issue ─► PM ─► Planner research ─► design? ─sim─► Designer ─► /opcao N ─┐              #
#                                       └─não───────────────────────────► Plano + eval   #
# Plano ─► aprovação? ─sim─► /aprovar plano ─┐                                           #
#             └─não───────────────────────────► Implementer ─► CI e Tester (repara       #
#   até o limite) ─► Reviewer ‖ evals do código ─► review humano? ─sim─► /aprovar merge  #
#             └─não──────────────────────────────────────────────► merge ─► Deployer     #
#                                                                                        #
# Only the repository owner can start or steer it. Setup: CLAUDE_CODE_OAUTH_TOKEN        #
# secret, the `priorizado` label, and "Allow GitHub Actions to create and approve pull   #
# requests". Deploy (Railway) isn't configured: the Deployer checks main's CI on the     #
# merge commit.                                                                          #
##########################################################################################

name: Harness

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to start
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read

# One run per issue at a time, so a step never reads a state another run is changing.
concurrency:
  group: harness-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  entry:
    name: Entrada da issue
    # Runs only for the repository owner, even on a public repo.
    if: >-
      github.actor == github.repository_owner && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'priorizado')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       github.event.comment.user.type == 'User' && contains(github.event.issue.labels.*.name, 'priorizado')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      next: ${{ steps.step.outputs.next }}
      issue: ${{ steps.step.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: entry
        env:
          GITHUB_TOKEN: ${{ github.token }}

  pm:
    name: 🤖 PM / encaminhamento
    needs: [entry]
    if: ${{ !cancelled() && contains(needs.*.outputs.next, 'pm') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      next: ${{ steps.step.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: pm
          issue: ${{ needs.entry.outputs.issue }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  research:
    name: 🤖 Planner / pesquisa ou investigação
    needs: [entry, pm]
    if: ${{ !cancelled() && contains(needs.*.outputs.next, 'research') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      next: ${{ steps.step.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: research
          issue: ${{ needs.entry.outputs.issue }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  design_need:
    name: 🤖 PM / precisa de design?
    needs: [entry, pm, research]
    if: ${{ !cancelled() && contains(needs.*.outputs.next, 'design_need') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      next: ${{ steps.step.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: design_need
          issue: ${{ needs.entry.outputs.issue }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  design:
    name: 🤖 Designer / três opções
    needs: [entry, design_need]
    if: ${{ !cancelled() && contains(needs.*.outputs.next, 'design') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      next: ${{ steps.step.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: design
          issue: ${{ needs.entry.outputs.issue }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  plan:
    name: 🤖 Planner / plano e eval de aderência
    needs: [entry, pm, research, design_need, design]
    if: ${{ !cancelled() && contains(needs.*.outputs.next, 'plan') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      next: ${{ steps.step.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: plan
          issue: ${{ needs.entry.outputs.issue }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  implement:
    name: 🤖 Implementer / PR
    needs: [entry, plan]
    if: ${{ !cancelled() && contains(needs.*.outputs.next, 'implement') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      next: ${{ steps.step.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: implement
          issue: ${{ needs.entry.outputs.issue }}
          yarn: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  test:
    name: 🤖 Tester / CI e critérios
    needs: [entry, implement]
    if: ${{ !cancelled() && contains(needs.*.outputs.next, 'test') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      next: ${{ steps.step.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: test
          issue: ${{ needs.entry.outputs.issue }}
          yarn: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  code_evals:
    name: 🤖 Reviewer / evals do código
    needs: [entry, test]
    if: ${{ !cancelled() && contains(needs.*.outputs.next, 'review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      next: ${{ steps.step.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: code_evals
          issue: ${{ needs.entry.outputs.issue }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review:
    name: 🤖 Reviewer / revisão independente
    needs: [entry, test]
    if: ${{ !cancelled() && contains(needs.*.outputs.next, 'review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      next: ${{ steps.step.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: review
          issue: ${{ needs.entry.outputs.issue }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review_gate:
    name: 🤖 Reviewer / gate de review
    needs: [entry, code_evals, review]
    if: ${{ !cancelled() && needs.code_evals.outputs.next == 'review_gate' && needs.review.outputs.next == 'review_gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      next: ${{ steps.step.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: review_gate
          issue: ${{ needs.entry.outputs.issue }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  merge:
    name: Gate de merge
    needs: [entry, review_gate]
    if: ${{ !cancelled() && contains(needs.*.outputs.next, 'merge') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      next: ${{ steps.step.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: merge
          issue: ${{ needs.entry.outputs.issue }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    name: 🤖 Deployer / versão integrada
    needs: [entry, merge]
    if: ${{ !cancelled() && contains(needs.*.outputs.next, 'deploy') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      next: ${{ steps.step.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: step
        uses: ./.github/actions/harness-step
        with:
          step: deploy
          issue: ${{ needs.entry.outputs.issue }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
